# Application Configuration for Integration Tests
# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/flowoa_db?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
spring.datasource.username=root
spring.datasource.password=lwh2005
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis Plus Configuration
mybatis-plus.mapper-locations=classpath*:mapper/*.xml,classpath*:org/openoa/engine/bpmnconf/mapper/xml/*.xml
mybatis-plus.type-aliases-package=org.openoa.base.entity,org.openoa.entity

# Activiti Configuration
spring.activiti.database-schema-update=true
spring.activiti.check-process-definitions=false
spring.activiti.async-executor-activate=false

# Logging
logging.level.org.openoa.mapper=DEBUG
logging.level.org.openoa.engine.bpmnconf.mapper=DEBUG
logging.level.org.springframework.jdbc.core=DEBUG
